<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Under Construction | Fengqi Group</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: #fff;
        color: #1a1814;
        font: 1rem/1.6 system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 36rem; }
      .brand {
        margin: 0;
        color: #8a6a1a;
        font-weight: 600;
      }
      .brand::after {
        content: "";
        display: block;
        width: 40px;
        height: 2px;
        margin: 24px auto;
        background: #b8912a;
      }
      h1 {
        margin: 0 0 12px;
        font: 400 2.25rem/1.15 Georgia, serif;
        overflow-wrap: anywhere;
      }
      .message { margin: 0; color: #6b6358; }
      @media (min-width: 640px) {
        h1 { font-size: 3.25rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Fengqi Group</p>
      <h1>Under Construction</h1>
      <p class="message">Please check back later.</p>
    </main>
  </body>
</html>
